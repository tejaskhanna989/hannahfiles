name: HannahFiles Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_PROJECT_PATH: 'windows\src\Files.App\Files.App.csproj'
  LAUNCHER_PROJECT_PATH: 'windows\src\Files.App.Launcher\Files.App.Launcher.vcxproj'

jobs:
  linux-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum

      - name: Release (GoReleaser)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: linux
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-release:
    needs: linux-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Restore solution
        run: |
          msbuild windows\Files.slnx `
            -t:Restore `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:PublishReadyToRun=true

      - name: Restore NuGet packages for Launcher project
        run: |
          nuget restore "$env:LAUNCHER_PROJECT_PATH" `
            -SolutionDirectory "windows"

      - name: Build launcher project
        run: |
          msbuild "$env:LAUNCHER_PROJECT_PATH" `
            -t:Build `
            -p:Platform=x64 `
            -p:Configuration=Release

      - name: Publish portable (self-contained, win-x64)
        run: |
          dotnet publish "$env:APP_PROJECT_PATH" `
            -c Release -r win-x64 --self-contained -p:Platform=x64

      - name: Create self-signed cert
        shell: pwsh
        run: windows\.github\scripts\Generate-SelfCertPfx.ps1 -Destination "${{ github.workspace }}\windows-ci-selfsigned.pfx"

      - name: Zip portable, build setup EXE, pack and sign MSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pub = Get-ChildItem windows\src\Files.App\bin\Release -Recurse -Directory |
            Where-Object { $_.FullName -like '*win-x64\publish' } |
            Select-Object -First 1
          if (-not $pub) { throw "Publish output not found" }
          Compress-Archive -Path "$($pub.FullName)\*" -DestinationPath "HannahFiles-windows-x64-portable.zip"
          choco install nsis -y --no-progress
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /DAPPDIR="$($pub.FullName)" /DOUTFILE="${{ github.workspace }}\HannahFiles-setup-x64.exe" windows\installer\hannahfiles.nsi
          $stage = "msix-stage"
          $cert = "${{ github.workspace }}\windows-ci-selfsigned.pfx"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$($pub.FullName)\*" $stage -Recurse
          Remove-Item "$stage\*.pdb" -Force
          New-Item -ItemType Directory -Force -Path "$stage\Assets\AppTiles\Dev" | Out-Null
          Copy-Item "windows\src\Files.App\Assets\AppTiles\Dev\*" "$stage\Assets\AppTiles\Dev\" -Recurse
          New-Item -ItemType Directory -Force -Path "$stage\Assets\Archives" | Out-Null
          Copy-Item "windows\src\Files.App\Assets\Archives\*" "$stage\Assets\Archives\"
          (Get-Content "windows\src\Files.App\Package.appxmanifest") -replace '\$targetnametoken\$','Files.App' -replace '\$targetentrypoint\$','Files.App.App' | Set-Content "$stage\AppxManifest.xml"
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          & "$($kit.FullName)\makeappx.exe" pack /d $stage /p "HannahFiles.msix"
          & "$($kit.FullName)\signtool.exe" sign /fd SHA256 /f $cert "HannahFiles.msix"
          gh release upload "${{ github.ref_name }}" "HannahFiles-windows-x64-portable.zip" "HannahFiles-setup-x64.exe" "HannahFiles.msix" --clobber

  gui-release:
    needs: linux-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux-gui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: linux-gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage + deb
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GUI installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.AppImage dist/*.deb --clobber
