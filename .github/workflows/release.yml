name: HannahFiles Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum

      - name: Release (GoReleaser)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: linux
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-release:
    needs: linux-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Restore solution
        run: |
          msbuild windows\Files.slnx `
            -t:Restore `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:PublishReadyToRun=true

      - name: Create self-signed cert
        shell: pwsh
        run: windows\.github\scripts\Generate-SelfCertPfx.ps1 -Destination "${{ github.workspace }}\windows-ci-selfsigned.pfx"

      - name: Build & package (signed MSIX, x64 Release)
        run: |
          msbuild windows\src\Files.App\Files.App.csproj `
            -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="${{ github.workspace }}\windows-ci-selfsigned.pfx" `
            -p:PackageCertificatePassword="" `
            -p:PackageCertificateThumbprint="" `
            -p:PublishReadyToRun=true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=x64 `
            -p:AppxPackageDir="${{ github.workspace }}\AppxPackages\"

      - name: Upload MSIX to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-ChildItem AppxPackages -Recurse -Include *.msixbundle, *.msix |
            Where-Object { $_.DirectoryName -notmatch '\\Dependencies\\' } |
            Select-Object -First 1
          if (-not $pkg) { throw "No .msixbundle found" }
          gh release upload "${{ github.ref_name }}" "$($pkg.FullName)" --clobber
