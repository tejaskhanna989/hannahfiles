name: HannahFiles Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_PROJECT_PATH: 'windows\src\Files.App\Files.App.csproj'
  LAUNCHER_PROJECT_PATH: 'windows\src\Files.App.Launcher\Files.App.Launcher.vcxproj'
  APPX_PACKAGE_DIR: '${{ github.workspace }}\AppxPackages'
  CERT_PATH: '${{ github.workspace }}\windows-ci-selfsigned.pfx'

jobs:
  linux-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum

      - name: Release (GoReleaser)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: linux
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-release:
    needs: linux-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Restore solution
        run: |
          msbuild windows\Files.slnx `
            -t:Restore `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:PublishReadyToRun=true

      - name: Restore NuGet packages for Launcher project
        run: |
          nuget restore "$env:LAUNCHER_PROJECT_PATH" `
            -SolutionDirectory "windows"

      - name: Build launcher project
        run: |
          msbuild "$env:LAUNCHER_PROJECT_PATH" `
            -t:Build `
            -p:Platform=x64 `
            -p:Configuration=Release

      - name: Create self-signed cert
        shell: pwsh
        run: windows\.github\scripts\Generate-SelfCertPfx.ps1 -Destination "$env:CERT_PATH"

      - name: Build & package Files (unsigned MSIX)
        run: |
          msbuild "$env:APP_PROJECT_PATH" `
            -t:Build `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:AppxPackageDir="$env:APPX_PACKAGE_DIR" `
            -p:AppxBundle=Never `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=Sideload

      - name: Create msixbundle
        shell: pwsh
        run: |
          windows\.github\scripts\Create-MsixBundle.ps1 `
            -AppxPackageDir "$env:APPX_PACKAGE_DIR" `
            -BundleName "HannahFiles.Package" `
            -PackageManifestPath "windows\src\Files.App\Package.appxmanifest" `
            -BuildMode "Sideload"

      - name: Sign bundle with self-signed cert
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $bundle = Get-ChildItem AppxPackages -Recurse -Filter *.msixbundle |
            Where-Object { $_.DirectoryName -notmatch '\\Dependencies\\' } |
            Select-Object -First 1
          if (-not $bundle) { throw "No .msixbundle found to sign" }
          & $signtool sign /fd SHA256 /f "$env:CERT_PATH" "$($bundle.FullName)"

      - name: Upload MSIX to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-ChildItem AppxPackages -Recurse -Filter *.msixbundle |
            Where-Object { $_.DirectoryName -notmatch '\\Dependencies\\' } |
            Select-Object -First 1
          gh release upload "${{ github.ref_name }}" "$($pkg.FullName)" --clobber
