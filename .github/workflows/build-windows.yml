name: HannahFiles CI — Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

env:
  SOLUTION_PATH: '${{ github.workspace }}\windows\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\windows\src\Files.App\Files.App.csproj'
  APPX_SELFSIGNED_CERT_PATH: '${{ github.workspace }}\windows-ci-selfsigned.pfx'

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Restore solution
        run: |
          msbuild $env:SOLUTION_PATH `
            -t:Restore `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:PublishReadyToRun=true

      - name: Create self-signed cert
        shell: pwsh
        run: windows\.github\scripts\Generate-SelfCertPfx.ps1 -Destination "$env:APPX_SELFSIGNED_CERT_PATH"

      - name: Build & package (signed MSIX, x64 Release)
        run: |
          msbuild $env:APP_PROJECT_PATH `
            -t:Build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$env:APPX_SELFSIGNED_CERT_PATH" `
            -p:PackageCertificatePassword="" `
            -p:PackageCertificateThumbprint="" `
            -p:PublishReadyToRun=true

      - name: Upload MSIX installer
        uses: actions/upload-artifact@v4
        with:
          name: HannahFiles-windows-x64
          path: |
            windows/**/AppPackages/**/*.msixbundle
            windows/**/AppPackages/**/*.msix
            windows/artifacts/**/*.msixbundle
            windows/artifacts/**/*.msix
          if-no-files-found: warn
