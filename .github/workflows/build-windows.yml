name: HannahFiles CI — Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

# MSIX packaging via GenerateAppxPackageOnBuild is currently a no-op on the
# hosted toolchain (it silently produces nothing, upstream included), so we
# ship a self-contained portable ZIP instead. MSIX signing can return later.
env:
  APP_PROJECT_PATH: 'windows\src\Files.App\Files.App.csproj'
  LAUNCHER_PROJECT_PATH: 'windows\src\Files.App.Launcher\Files.App.Launcher.vcxproj'

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: windows/global.json

      - name: Restore solution
        run: |
          msbuild windows\Files.slnx `
            -t:Restore `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:PublishReadyToRun=true

      - name: Restore NuGet packages for Launcher project
        run: |
          nuget restore "$env:LAUNCHER_PROJECT_PATH" `
            -SolutionDirectory "windows"

      - name: Build launcher project
        run: |
          msbuild "$env:LAUNCHER_PROJECT_PATH" `
            -t:Build `
            -p:Platform=x64 `
            -p:Configuration=Release

      - name: Publish portable (self-contained, win-x64)
        run: |
          dotnet publish "$env:APP_PROJECT_PATH" `
            -c Release -r win-x64 --self-contained

      - name: Zip portable build
        shell: pwsh
        run: |
          $pub = Get-ChildItem windows\src\Files.App\bin\Release -Recurse -Directory |
            Where-Object { $_.FullName -like '*win-x64\publish' } |
            Select-Object -First 1
          if (-not $pub) { throw "Publish output not found" }
          Compress-Archive -Path "$($pub.FullName)\*" -DestinationPath "HannahFiles-windows-x64-portable.zip"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HannahFiles-windows-x64-portable
          path: HannahFiles-windows-x64-portable.zip
