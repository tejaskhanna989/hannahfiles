name: HannahFiles CI — Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore + build (x64 Release, unsigned)
        run: msbuild Files.slnx /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /m /restore

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: HannahFiles-windows-x64
          path: windows/artifacts/**/*.msix
          if-no-files-found: warn
