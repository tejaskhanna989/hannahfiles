version: 2

project_name: hannahfiles

builds:
  - id: hannahfiles
    main: .
    binary: hannahfiles
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/tejaskhanna989/hannahfiles/linux/src/config.CurrentVersion={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE.md
      - README.md
      - asset/hannahfiles.desktop
      - asset/hannahfiles.svg
      - asset/io.github.tejaskhanna989.hannahfiles.metainfo.xml
      - ../wallpapers/*.jpg
      - ../wallpapers/ATTRIBUTION.md

nfpms:
  - package_name: hannahfiles
    ids:
      - hannahfiles
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    maintainer: tejaskhanna989 <https://github.com/tejaskhanna989/hannahfiles>
    description: HannahFiles — fancy terminal file manager for Linux (GPLv3 fork of superfile).
    homepage: https://github.com/tejaskhanna989/hannahfiles
    license: GPL-3.0-only
    contents:
      # Note: the hannahfiles binary itself is added automatically.
      - src: asset/hannahfiles.desktop
        dst: /usr/share/applications/hannahfiles.desktop
      - src: asset/io.github.tejaskhanna989.hannahfiles.metainfo.xml
        dst: /usr/share/metainfo/io.github.tejaskhanna989.hannahfiles.metainfo.xml
      - src: asset/hannahfiles.svg
        dst: /usr/share/icons/hicolor/scalable/apps/hannahfiles.svg
      - src: ../wallpapers/*.jpg
        dst: /usr/share/hannahfiles/wallpapers/
      - src: ../wallpapers/ATTRIBUTION.md
        dst: /usr/share/doc/hannahfiles/ATTRIBUTION.md

changelog:
  sort: asc
  use: github
