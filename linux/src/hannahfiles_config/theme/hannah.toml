###############################################################################
#                             Hannah Theme                                    #
#                  Best of both worlds: pop star purple + gold                #
###############################################################################

# This contains the theme config file for hannahfiles! For more details see:
# https://github.com/tejaskhanna989/hannahfiles/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "dracula"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#f3e8ff"
full_screen_bg = "#1a0b2e"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#c026d3", "#ffd166"]
directory_icon_color = "#ffd166"

#-- File Panel
file_panel_fg = "#f3e8ff"
file_panel_bg = "#1a0b2e"
file_panel_border = "#5b21b6"
file_panel_border_active = "#ff5da2"
file_panel_top_directory_icon = "#ffd166"
file_panel_top_path = "#f0abfc"
file_panel_item_selected_fg = "#1a0b2e"
file_panel_item_selected_bg = "#ff5da2"

#-- Footer
footer_fg = "#f3e8ff"
footer_bg = "#1a0b2e"
footer_border = "#5b21b6"
footer_border_active = "#ff5da2"

#-- Sidebar
sidebar_fg = "#f3e8ff"
sidebar_bg = "#1a0b2e"
sidebar_title = "#ffd166"
sidebar_border = "#1a0b2e"
sidebar_border_active = "#c026d3"
sidebar_item_selected_fg = "#1a0b2e"
sidebar_item_selected_bg = "#ffd166"
sidebar_divider = "#5b21b6"

#-- Modal
modal_fg = "#f3e8ff"
modal_bg = "#2a1245"
modal_border_active = "#ff5da2"
modal_cancel_fg = "#1a0b2e"
modal_cancel_bg = "#f0abfc"
modal_confirm_fg = "#1a0b2e"
modal_confirm_bg = "#ffd166"

#-- Help Menu
help_menu_hotkey = "#ffd166"
help_menu_title = "#ff5da2"

#-- Misc
cursor = "#ffd166"
correct = "#a6e3a1"
error = "#ff5da2"
hint = "#f0abfc"
cancel = "#f0abfc"
