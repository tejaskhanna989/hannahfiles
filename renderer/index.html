<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HannahFiles</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">📁 HannahFiles</div>
    <div id="nav-btns">
      <button id="btn-back" title="Back">←</button>
      <button id="btn-fwd" title="Forward">→</button>
      <button id="btn-up" title="Up">↑</button>
    </div>
    <nav id="crumbs"></nav>
    <input id="search" type="search" placeholder="Search (in current folder)…" />
    <div class="top-actions">
      <button id="btn-new-file" title="New file">+File</button>
      <button id="btn-new-folder" title="New folder">+Folder</button>
      <button id="btn-view" title="Toggle view (grid/list/details)">⊞</button>
      <button id="btn-dual" title="Toggle dual pane">⫿</button>
      <button id="btn-preview" title="Toggle preview">👁</button>
      <button id="btn-hidden" title="Show hidden">👻</button>
      <button id="btn-theme" title="Light/dark">🌙</button>
    </div>
  </header>

  <div id="tabsbar">
    <div id="tabs"></div>
    <button id="btn-new-tab" title="New tab">+</button>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div class="side-sec">
        <h4>★ Favorites <button id="btn-add-fav" class="mini" title="Add current folder">+</button></h4>
        <ul id="favs"></ul>
      </div>
      <div class="side-sec">
        <h4>🏷 Tags</h4>
        <ul id="taglist"></ul>
      </div>
      <div class="side-sec">
        <h4>💽 Locations</h4>
        <ul id="drives"></ul>
      </div>
    </aside>

    <section id="panes">
      <div class="pane" id="pane-left">
        <div class="pane-head"><span>◀ Left</span><span class="pane-path" id="pane-left-path"></span>
          <button class="mini" id="btn-copy-other" title="Copy selection to other pane">⇄ copy→</button>
          <button class="mini" id="btn-move-other" title="Move selection to other pane">⇄ move→</button>
        </div>
        <div class="file-area" id="files-left" tabindex="0"></div>
      </div>
      <div class="pane hidden" id="pane-right">
        <div class="pane-head"><span>▶ Right</span><span class="pane-path" id="pane-right-path"></span></div>
        <div class="file-area" id="files-right" tabindex="0"></div>
      </div>
    </section>

    <aside id="preview" class="hidden">
      <div class="prev-head">Preview <button id="btn-close-prev" class="mini">✕</button></div>
      <div id="prev-body"><p class="muted">Select a file to preview</p></div>
    </aside>
  </div>

  <footer id="statusbar">
    <span id="status-items"></span>
    <span id="status-sel"></span>
    <span id="status-clip"></span>
    <span id="status-platform"></span>
  </footer>
</div>

<div id="ctx" class="hidden"></div>

<div id="modal-wrap" class="hidden">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <input id="modal-input" type="text" />
    <div id="modal-extra"></div>
    <div class="modal-btns">
      <button id="modal-ok">OK</button>
      <button id="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
