<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HannahFiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">HF</span><span class="brand-name">HannahFiles</span></div>
    <div id="nav-btns">
      <button id="btn-back" class="icon-btn" title="Back">←</button>
      <button id="btn-fwd" class="icon-btn" title="Forward">→</button>
      <button id="btn-up" class="icon-btn" title="Up one level">↑</button>
    </div>
    <nav id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" placeholder="Search current folder…" />
    </div>
    <div class="top-actions">
      <button id="btn-new-file" class="btn" title="New file"><span>+</span> File</button>
      <button id="btn-new-folder" class="btn primary" title="New folder"><span>+</span> Folder</button>
      <span class="sep"></span>
      <button id="btn-view" class="icon-btn" title="Toggle view (grid / list / details)">⊞</button>
      <button id="btn-dual" class="icon-btn" title="Toggle dual pane">⫿</button>
      <button id="btn-preview" class="icon-btn" title="Toggle preview">◐</button>
      <button id="btn-hidden" class="icon-btn dim" title="Show hidden files">· · ·</button>
      <button id="btn-theme" class="icon-btn" title="Light / dark">🌙</button>
    </div>
  </header>

  <div id="tabsbar">
    <div id="tabs"></div>
    <button id="btn-new-tab" class="icon-btn" title="New tab">+</button>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div class="side-sec">
        <h4>Favorites <button id="btn-add-fav" class="mini" title="Add current folder">+</button></h4>
        <ul id="favs"></ul>
      </div>
      <div class="side-sec">
        <h4>Tags</h4>
        <ul id="taglist"></ul>
      </div>
      <div class="side-sec">
        <h4>Locations</h4>
        <ul id="drives"></ul>
      </div>
    </aside>

    <section id="panes">
      <div class="pane" id="pane-left">
        <div class="pane-head">
          <span class="pane-dot"></span><span class="pane-title">Left</span>
          <span class="pane-path" id="pane-left-path"></span>
          <button class="mini" id="btn-copy-other" title="Copy selection to other pane">copy →</button>
          <button class="mini" id="btn-move-other" title="Move selection to other pane">move →</button>
        </div>
        <div class="file-area" id="files-left" tabindex="0"></div>
      </div>
      <div class="pane hidden" id="pane-right">
        <div class="pane-head">
          <span class="pane-dot"></span><span class="pane-title">Right</span>
          <span class="pane-path" id="pane-right-path"></span>
        </div>
        <div class="file-area" id="files-right" tabindex="0"></div>
      </div>
    </section>

    <aside id="preview" class="hidden">
      <div class="prev-head"><span>Preview</span><button id="btn-close-prev" class="mini">✕</button></div>
      <div id="prev-body"><p class="muted">Select a file to preview</p></div>
    </aside>
  </div>

  <footer id="statusbar">
    <span id="status-items"></span>
    <span id="status-sel"></span>
    <span class="spacer"></span>
    <span id="status-clip"></span>
    <span id="status-platform"></span>
  </footer>
</div>

<div id="ctx" class="hidden"></div>

<div id="modal-wrap" class="hidden">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <input id="modal-input" type="text" />
    <div id="modal-extra"></div>
    <div class="modal-btns">
      <button id="modal-cancel" class="btn">Cancel</button>
      <button id="modal-ok" class="btn primary">OK</button>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
